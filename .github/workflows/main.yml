name: Deploy WASM Client to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix Path Bug (Pre-create folders)
        run: |
          mkdir -p target_teavm_wasm_gc/javascript
          mkdir -p target_teavm_wasm_gc/javascript_dist
          touch target_teavm_wasm_gc/javascript_dist/bootstrap.js

      - name: Build WASM-GC Client
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle

      - name: Gather Output Files and Fix HTML Name
        run: |
          mkdir -p final_output
          # 生成された可能性のある場所からファイルをすべて集めます
          cp -r target_teavm_wasm_gc/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/teavm/javascript_dist/* final_output/ 2>/dev/null || true
          
          # もし奥のフォルダーに固まっていたら手前に引っ張り出します
          if [ -d final_output/javascript_dist ]; then
            cp -r final_output/javascript_dist/* final_output/
          fi
          
          # 拡張子が .html のファイルを強制的に index.html という名前に書き換えて固定します
          cd final_output
          first_html=$(ls *.html 2>/dev/null | head -n 1)
          if [ ! -z "$first_html" ] && [ "$first_html" != "index.html" ]; then
            mv "$first_html" index.html
          fi
          
          # 本物の起動コード(bootstrap.js)が空っぽだった場合の対策（ファイルを直接書き換え）
          if [ -f index.html ]; then
            # HTML内にある古い読み込み記述をブラウザが解釈できる形に全自動修正します
            sed -i 's|../javascript_dist/bootstrap.js|bootstrap.js|g' index.html
            sed -i 's|javascript/../javascript_dist/bootstrap.js|bootstrap.js|g' index.html
          fi
          ls -la

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "final_output/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
