name: Deploy WASM Client to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Real Bootstrap JS
        run: |
          mkdir -p target_teavm_wasm_gc/javascript
          mkdir -p target_teavm_wasm_gc/javascript_dist
          
          # 本物のWASM-GC起動用コードを直接ファイルに書き込みます
          cat << 'EOF' > target_teavm_wasm_gc/javascript_dist/bootstrap.js
          (function() {
              'use strict';
              window.addEventListener("load", function() {
                  if (typeof main === "function") {
                      main();
                  } else if (typeof TeaVM !== "undefined" && typeof TeaVM.run === "function") {
                      TeaVM.run();
                  } else {
                      console.log("WASM-GC Bootstrap: Waiting for main class...");
                  }
              });
          })();
          EOF

      - name: Build WASM-GC Client
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle

      - name: Gather Output Files
        run: |
          mkdir -p final_output
          cp -r target_teavm_wasm_gc/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/teavm/javascript_dist/* final_output/ 2>/dev/null || true
          
          cd final_output
          first_html=$(ls *.html 2>/dev/null | head -n 1)
          if [ ! -z "$first_html" ] && [ "$first_html" != "index.html" ]; then
            mv "$first_html" index.html
          fi
          
          if [ -f index.html ]; then
            sed -i 's|../javascript_dist/bootstrap.js|bootstrap.js|g' index.html
            sed -i 's|javascript/../javascript_dist/bootstrap.js|bootstrap.js|g' index.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "final_output/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
