name: Build WASM Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix Path Bug (Pre-create folders)
        run: |
          mkdir -p target_teavm_wasm_gc/javascript
          mkdir -p target_teavm_wasm_gc/javascript_dist
          touch target_teavm_wasm_gc/javascript_dist/bootstrap.js

      - name: Build WASM-GC Client
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: javascript_dist_output
          path: "**/javascript_dist/"
