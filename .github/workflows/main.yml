name: Deploy WASM Client to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix Path Bug (Pre-create folders)
        run: |
          mkdir -p target_teavm_wasm_gc/javascript
          mkdir -p target_teavm_wasm_gc/javascript_dist
          touch target_teavm_wasm_gc/javascript_dist/bootstrap.js

      - name: Build WASM-GC Client
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle

      - name: Gather Output Files
        run: |
          mkdir -p final_output
          # 生成された可能性のある場所からファイルを1つの場所に集めます
          cp -r target_teavm_wasm_gc/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/teavm/javascript_dist/* final_output/ 2>/dev/null || true
          # 最低限index.htmlがあるか確認（デバッグ用）
          ls -la final_output

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "final_output/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
