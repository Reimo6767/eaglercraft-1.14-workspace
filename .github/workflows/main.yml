name: Deploy WASM Client to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-build Tasks
        run: ./gradlew :target_teavm_wasm_gc:teavmCompileLog 2>/dev/null || true

      - name: Build WASM-GC Client
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle

      - name: Gather Output Files and Fix Bootstrap
        run: |
          mkdir -p final_output
          
          # 成果物フォルダーを最優先で集める
          cp -r target_teavm_wasm_gc/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/javascript_dist/* final_output/ 2>/dev/null || true
          cp -r target_teavm_wasm_gc/build/teavm/javascript_dist/* final_output/ 2>/dev/null || true
          
          # プロジェクト内に眠っている本物のbootstrap.jsを探して強制上書き配置
          find . -name "bootstrap.js" -not -path "*/final_output/*" -exec cp {} final_output/ \; 2>/dev/null || true
          
          # HTMLの名前をindex.htmlに固定
          cd final_output
          first_html=$(ls *.html 2>/dev/null | head -n 1)
          if [ ! -z "$first_html" ] && [ "$first_html" != "index.html" ]; then
            mv "$first_html" index.html
          fi
          
          # パスの書き換え処理
          if [ -f index.html ]; then
            sed -i 's|../javascript_dist/bootstrap.js|bootstrap.js|g' index.html
            sed -i 's|javascript/../javascript_dist/bootstrap.js|bootstrap.js|g' index.html
          fi
          ls -la

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "final_output/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
